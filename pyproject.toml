[project]
name = "django-cartographie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aerich[toml]>=0.9.1",
    "asyncpg>=0.30.0",
    "black>=25.1.0",
    "click>=8.2.1",
    "fastapi[standard]>=0.115.12",
    "greenlet>=3.2.3",
    "pyjwt>=2.10.1",
    "tortoise-orm[asyncpg]>=0.25.1",
    "uuid7>=0.1.0",
]

[tool.aerich]
tortoise_orm = "config.settings.TORTOISE_ORM"
location = "./apps/migrations"
